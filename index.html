<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fungatepsv - Em construção</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            font-family:Segoe UI, Arial, sans-serif;
            background: linear-gradient(135deg, #2b1055, #6a00f4);
            color:white;
            text-align:center;
        }

        .box{
            background: rgba(0,0,0,0.35);
            padding:40px 60px;
            border-radius:16px;
            backdrop-filter: blur(6px);
        }

        h1{
            margin:0 0 10px;
            font-size:40px;
        }

        p{
            margin:0;
            opacity:0.85;
        }

        .social{
            margin-top:30px;
            font-size:18px;
            opacity:0.95;
        }

        .social a{
            color:#d6b8ff;
            text-decoration:none;
            font-weight:600;
        }

        .social a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🚧 Em construção</h1>
        <p>fungatepsv.com.br</p>
        <p>Voltamos em breve.</p>
    </div>

    <div class="social">
        <p>Enquanto isso, siga-nos no Instagram:
            <a href="https://instagram.com/fungatepsv" target="_blank">@fungatepsv</a>
        </p>
        <p>E no X
            <a href="https://x.com/fungateps" target="_blank">@fungateps</a>
        </p>
    </div>

</html>
